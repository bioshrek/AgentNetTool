[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-process"
version = "0.1.0"
description = "Data processing tools for OpenCUA"
readme = "README.md"
requires-python = "<3.12,>=3.11"
dependencies = [
    "opencv-python>=4.9.0",
    "Pillow>=10.4.0",
    "pydantic>=2.8.2",
    "tqdm>=4.66.0",
    "orjson>=3.10.7",
    "pybase64>=1.4.0",
    "numpy>=1.26.0",
    "pyautogui>=0.9.54",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
